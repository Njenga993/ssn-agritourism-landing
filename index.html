<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Agroecology Logo.png" />
    <link rel="apple-touch-icon" href="/Agroecology Logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- SEO Meta Tags (fallback - will be overridden by Helmet) -->
    <title>Seed Savers Network Kenya | Ecology, Food & Culture Tourism</title>
    <meta
      name="description"
      content="Immersive agroecology tourism in Kenya. Experience seed sovereignty, indigenous food systems, and community resilience with Seed Savers Network Kenya."
    />
    <meta name="theme-color" content="#2d5a27" />

    <!-- Performance: Preconnect to critical third-party domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="//www.google-analytics.com" />
    <link rel="dns-prefetch" href="//www.googletagmanager.com" />

    <!-- Performance: Preload critical assets -->
    <link rel="preload" as="image" href="/Agroecology Logo.png" />
    <link rel="preload" as="image" href="/hero-bg.jpg" type="image/jpeg" />

    <!-- Security: Prevent clickjacking -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Mobile & PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Seed Savers Kenya" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Robots (allow indexing) -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Author & Publisher -->
    <meta name="author" content="Seed Savers Network Kenya" />
    <meta name="publisher" content="Seed Savers Network Kenya" />

    <!-- Geo Tags for Local SEO (Kenya) -->
    <meta name="geo.region" content="KE-19" />
    <meta name="geo.placename" content="Gilgil, Nakuru County" />
    <meta name="geo.position" content="-0.7833;36.3667" />
    <meta name="ICBM" content="-0.7833, 36.3667" />

    <!-- Open Graph (fallback) -->
    <meta property="og:site_name" content="Seed Savers Network Kenya" />
    <meta property="og:locale" content="en_KE" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card (fallback) -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
